<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Manifest{% endblock %} | YOUTH ROBE</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top">
  <a class="brand" href="{{ url_for('dashboard') if session.user else url_for('login') }}">YOUTH ROBE<small>Manifest &amp; Gatepass</small></a>
  {% if session.user %}
  <nav>
    <a href="{{ url_for('dashboard') }}">All records</a>
    <a class="btn small" href="{{ url_for('new') }}">+ New</a>
    <form method="post" action="{{ url_for('logout') }}" class="inline">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <button class="link" title="{{ session.user.name }}">Logout</button>
    </form>
  </nav>
  {% endif %}
</header>
<main>
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
