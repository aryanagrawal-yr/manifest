{% extends "base.html" %}
{% block title %}New dispatch{% endblock %}
{% block content %}
<h1>New manifest &amp; gatepass</h1>
<p class="muted">Enter the details once. Both documents are generated from the same record.</p>
<form method="post" class="card grid">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">

  <label>Date &amp; time
    <input type="datetime-local" name="dispatch_dt" value="{{ f.dispatch_dt }}" required>
  </label>
  <label>Employee name (Youth Robe)
    <input name="employee" value="{{ f.employee }}" required maxlength="80">
  </label>

  <label>Logistics partner
    <input name="partner" list="partners" value="{{ f.partner }}" required maxlength="60" placeholder="e.g. Delhivery">
    <datalist id="partners">{% for p in partners %}<option value="{{ p }}">{% endfor %}</datalist>
  </label>
  <label>Courier boy name
    <input name="courier_name" value="{{ f.courier_name }}" required maxlength="80">
  </label>

  <label>Courier boy phone
    <input name="courier_phone" value="{{ f.courier_phone }}" required inputmode="tel" placeholder="10 digit number">
  </label>
  <label>Vehicle number
    <input name="vehicle_no" value="{{ f.vehicle_no }}" required maxlength="20" placeholder="MP 09 AB 1234" style="text-transform:uppercase">
  </label>

  <label>Vehicle type
    <select name="vehicle_type" required>
      <option value="">Select...</option>
      {% for v in vtypes %}<option {{ 'selected' if v == f.vehicle_type }}>{{ v }}</option>{% endfor %}
    </select>
  </label>
  <label>Notes (optional)
    <input name="notes" value="{{ f.notes }}" maxlength="300">
  </label>

  <label class="full">Order IDs / AWB numbers
    <textarea name="refs" rows="10" required placeholder="One per line (or separated by commas / spaces)">{{ f.refs }}</textarea>
    <small class="muted">Paste straight from a sheet. Duplicates inside this list are removed automatically.</small>
  </label>

  <div class="full"><button class="btn">Create manifest &amp; gatepass</button></div>
</form>
{% endblock %}
